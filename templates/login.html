<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The King of Meal Prep — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" href="/static/fonts/ibm-plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-page">
<main class="auth-card" role="main">
  <div class="auth-mark">KING</div>
  <h1 class="auth-title">The King of Meal Prep</h1>
  <p class="auth-subtitle">Sign in to continue.</p>

  <div class="auth-error" id="loginError" role="alert"></div>
  <div class="auth-info"  id="loginInfo"  role="status"></div>

  <div class="auth-field">
    <label class="auth-label" for="username">Username</label>
    <input class="auth-input" type="text" id="username" autocomplete="username" autofocus>
  </div>
  <div class="auth-field">
    <label class="auth-label" for="password">Password</label>
    <input class="auth-input" type="password" id="password" autocomplete="current-password">
  </div>

  <button class="auth-btn" id="loginBtn" type="button" onclick="doLogin()">Sign in</button>
  <button class="auth-link" id="forgotBtn" type="button" onclick="doForgot()">Forgot password</button>

  <footer class="auth-footer">Single admin · tailnet only</footer>
</main>
<script>
document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
function doLogin() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  if (!u || !p) { err.textContent = "Enter username and password."; err.classList.add("visible"); return; }
  btn.disabled = true; btn.innerHTML = '<span class="auth-spinner"></span>Signing in';
  err.classList.remove("visible");
  fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p }),
  }).then(r => r.json()).then(d => {
    if (d.ok) { window.location.href = "/"; }
    else {
      err.textContent = d.error || "Invalid credentials.";
      err.classList.add("visible");
      btn.disabled = false; btn.textContent = "Sign in";
    }
  }).catch(() => {
    err.textContent = "Connection error.";
    err.classList.add("visible");
    btn.disabled = false; btn.textContent = "Sign in";
  });
}
function doForgot() {
  const btn = document.getElementById("forgotBtn");
  const info = document.getElementById("loginInfo");
  const err = document.getElementById("loginError");
  err.classList.remove("visible");
  btn.disabled = true; btn.textContent = "Sending…";
  fetch("/api/forgot-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: "{}",
  }).then(() => {
    info.textContent = "If an email is configured you'll receive a reset link.";
    info.classList.add("visible");
    btn.textContent = "Email sent";
  }).catch(() => {
    err.textContent = "Connection error.";
    err.classList.add("visible");
    btn.disabled = false; btn.textContent = "Forgot password";
  });
}
</script>
</body>
</html>
